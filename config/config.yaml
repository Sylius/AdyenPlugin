imports:
    - { resource: "@SyliusAdyenPlugin/config/grids/*/*.yaml" }
    - { resource: "@SyliusAdyenPlugin/config/twig_hooks/**/*.yaml" }
    - { resource: "@SyliusAdyenPlugin/config/workflow/**.yaml" }
    - { resource: "@SyliusAdyenPlugin/config/sylius_adyen.yaml" }
    - { resource: "@SyliusAdyenPlugin/config/winzou_state_machine.php" }

sylius_mailer:
    emails:
        adyen_payment_link:
            subject: Payment link
            template: "@SyliusAdyenPlugin/email/payment_link.html.twig"

monolog:
    channels: ['adyen']
    handlers:
        adyen_doctrine:
            type: service
            id: sylius_adyen.logging.monolog.doctrine_handler
            channels: ['adyen']
