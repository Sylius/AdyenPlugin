sylius_twig_hooks:
    hooks:
        'sylius_admin.product.update.content.form.side_navigation':
            esd:
                template: '@SyliusAdyenPlugin/admin/product/form/side_navigation/esd.html.twig'
                priority: -100

        'sylius_admin.product.update.content.form.sections':
            esd:
                template: '@SyliusAdyenPlugin/admin/product/form/sections/esd.html.twig'
                priority: -100

        'sylius_admin.product.update.content.form.sections.esd':
            commodity_code:
                template: '@SyliusAdyenPlugin/admin/product/form/sections/esd/commodity_code.html.twig'
                priority: 0
